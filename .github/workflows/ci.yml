name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its older run. A push to main never cancels: each merge runs in full.
# Outside a PR the group is the run id, so pending main runs never replace each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-orca
      - run: orca-ide plugin test . --json

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-orca
      - run: .github/scripts/typecheck.sh
        env:
          ORCA: orca-ide

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks CLI (MIT), fixed version, SHA-256 checked before it runs. Scans the whole history.
      # Known fake secrets in tests are allowed in .gitleaks.toml.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner
