name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `orca plugin test` brings the `orca/testing` kit; it ships only with the Orca CLI.
      - name: Install Orca CLI
        env:
          GH_TOKEN: ${{ github.token }}
          ORCA_VERSION: v1.4.274
        run: |
          gh release download "$ORCA_VERSION" --repo stablyai/orca --pattern 'orca-ide_*_amd64.deb' --dir "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP"/orca-ide_*_amd64.deb

      - name: Unit tests
        run: orca-ide plugin test . --json
