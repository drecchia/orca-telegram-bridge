name: Claude Code

# Mention @claude in an issue, a PR comment or a review to have Claude Code act on it.
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`) and the Claude GitHub App.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # Claude pushes commits to PR branches
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Claude reads CI results on PRs
    steps:
      # Full history so Claude can merge or rebase the base branch. persist-credentials: false keeps
      # the job's GITHUB_TOKEN out of .git/config; git push uses the token the Claude action sets.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Lets Claude run the tests (`orca-ide plugin test . --json`).
      - uses: ./.github/actions/setup-orca

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
